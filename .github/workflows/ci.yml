name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install -r ai-service/requirements-dev.txt
      - name: Run AI service pytest
        run: python -m pytest ai-service/tests
      - name: Run OULAD dataset script pytest
        run: python -m pytest scripts/datasets

  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run dotnet unit tests
        run: dotnet test backend/EducationalCompanion.Tests/EducationalCompanion.Tests.csproj -c Release
      - name: Run dotnet integration tests (SQLite)
        run: dotnet test backend/EducationalCompanion.Tests.Integration/EducationalCompanion.Tests.Integration.csproj -c Release

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Run Vitest
        run: npm test
